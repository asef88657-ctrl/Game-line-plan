/* Persian digits for text nodes only (never attributes, never code) */
const SKIP_DIGITS = ['SCRIPT','STYLE','CODE','PRE','INPUT','TEXTAREA','[contenteditable="true"]'];
function localizeDigits(root){
  if(!root || !isFa()) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      if(!/[0-9]/.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
      let p = node.parentElement;
      while(p && p !== root){
        if(SKIP_DIGITS.includes(p.tagName) || p.isContentEditable) return NodeFilter.FILTER_REJECT;
        if(p.classList && (p.classList.contains('t') || p.classList.contains('note-body'))) return NodeFilter.FILTER_REJECT;
        p = p.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{ n.nodeValue = n.nodeValue.replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[+d]); });
}

/* ---------- attach post-render listeners ---------- */
function attach(){
  const search = document.getElementById('noteSearch');
  if(search){
    search.oninput = e => { noteState.q = e.target.value; const el = document.getElementById('noteSearch'); render(); const s2 = document.getElementById('noteSearch'); if(s2){ s2.focus(); s2.setSelectionRange(s2.value.length,s2.value.length);} };
  }
  const title = document.getElementById('noteTitle');
  if(title) title.oninput = e => {
    const n = DB.data.notes.find(x=>x.id===noteState.id);
    if(n){ n.title = e.target.value; n.updated = Date.now(); DB.save(); }
  };
  const body = document.getElementById('noteBody');
  if(body) body.oninput = debounce(()=>{
    const n = DB.data.notes.find(x=>x.id===noteState.id);
    if(n){ n.body = body.innerHTML; n.updated = Date.now(); DB.save();
      const s = document.getElementById('noteSaved'); if(s) s.textContent = t('noteSaved'); }
  }, 700);
  document.querySelectorAll('[data-cmd]').forEach(b=>{
    b.onclick = ()=>{
      const cmd = b.dataset.cmd, val = b.dataset.val || null;
      document.getElementById('noteBody')?.focus();
      try{ document.execCommand(cmd, false, val); }catch(e){}
      const n = DB.data.notes.find(x=>x.id===noteState.id);
      const nb = document.getElementById('noteBody');
      if(n && nb){ n.body = nb.innerHTML; n.updated = Date.now(); DB.save(); }
    };
  });
  const pf = document.getElementById('pdfFile');
  if(pf) pf.onchange = e => { const f = e.target.files[0]; if(f) openPdfFile(f); };
  const pi = document.getElementById('pdfPageInput');
  if(pi) pi.onchange = e => {
    const n = clamp(parseInt(e.target.value||'1',10)||1, 1, pdfState.pages||1);
    pdfState.page = n; if(pdfState.doc) renderPdfPage(); render();
  };
  const imp = document.getElementById('importFile');
  if(imp) imp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { try{ DB.import(r.result); toast(t('imported')); applyTheme(); render(); }catch(err){ toast(t('importFail')); } };
    r.readAsText(f);
  };
  const quick = document.getElementById('quickAddInput');
  if(quick) quick.onkeydown = e => { if(e.key === 'Enter') quickAdd(); };
  const chat = document.getElementById('chatInput');
  if(chat) chat.onkeydown = e => { if(e.key === 'Enter') sendChat(); };
  if(view === 'assistant'){
    const box = document.getElementById('chatBox');
    if(box) box.lastElementChild?.scrollIntoView({block:'end'});
    chat?.focus({preventScroll:true});
  }
  if(view === 'pdf' && pdfState.doc && !document.querySelector('#pdfStage canvas')) renderPdfPage();
}
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

/* ---------- global click router ---------- */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  switch(act){
    /* navigation */
    case 'go': closeSheet(); go(el.dataset.view); break;
    case 'plannerMode': plannerMode = el.dataset.mode; render(); break;
    case 'shiftDate': {
      const d = new Date(plannerDate+'T00:00');
      if(plannerMode==='day') d.setDate(d.getDate()+Number(el.dataset.dir));
      if(plannerMode==='week') d.setDate(d.getDate()+7*Number(el.dataset.dir));
      if(plannerMode==='month') d.setMonth(d.getMonth()+Number(el.dataset.dir));
      plannerDate = todayKey(d); render(); break;
    }
    case 'pickDay': plannerDate = el.dataset.day; plannerMode='day'; render(); break;

    /* tasks */
    case 'newTask': taskSheet(); break;
    case 'editTask': taskSheet(id); break;
    case 'toggleTask': toggleTask(id); break;
    case 'quickAdd': quickAdd(); break;
    case 'rescheduleOverdue': {
      const k = todayKey(), tm = todayKey(new Date(Date.now()+86400000));
      DB.data.tasks.forEach(x=>{ if(!x.done && x.day && dayDiff(x.day,k)>0) x.day = tm; });
      DB.save(); toast(isFa()?'به فردا منتقل شد':'Moved to tomorrow'); render(); break;
    }

    /* habits */
    case 'newHabit': habitSheet(); break;
    case 'toggleHabit': toggleHabit(DB.data.habits.find(h=>h.id===id)); break;
    case 'archiveHabit': {
      const h = DB.data.habits.find(x=>x.id===id);
      confirmSheet(isFa()?'این عادت بایگانی شود؟':'Archive this habit?', ()=>{
        if(h){ h.archived = true; DB.save(); render(); } });
      break;
    }

    /* missions */
    case 'claimMission': {
      const m = [...missionsFor('daily'), ...missionsFor('weekly')].find(x=>x.id===id);
      if(m) claimMission(m);
      break;
    }

    /* study */
    case 'newSubject': subjectSheet(); break;
    case 'newSession': sessionSheet(); break;
    case 'newExam': examSheet(); break;

    /* focus */
    case 'focusMode': {
      if(focus.running) focusPause();
      focus.mode = el.dataset.mode;
      focus.total = focus.mode==='break' ? 5*60 : focus.mode==='stopwatch' ? 0 : 25*60;
      focus.sec = focus.total; focus.elapsed = 0; render(); break;
    }
    case 'focusToggle': focus.running ? focusPause() : focusStart(); break;
    case 'focusReset': focusStopReset(); break;
    case 'focusPreset': {
      const m = Number(el.dataset.min);
      focus.total = m*60; focus.sec = m*60; focus.elapsed = 0; render(); break;
    }
    case 'toggleSound': {
      const sid = id;
      if(activeAudio[sid]) stopSound(sid); else playSound(sid, .6);
      render(); break;
    }
    case 'sleepTimer': {
      const v = Number(document.getElementById('sleepSel')?.value || 0);
      if(!v){ toast(t('off')); break; }
      setTimeout(()=>{ stopAllSounds(); toast(isFa()?'صداها خاموش شد':'Audio stopped'); if(view==='focus') render(); }, v*60000);
      toast((isFa()?'تایمر خواب: ':'Sleep timer: ')+v+' '+t('minutes')); break;
    }

    /* notebook */
    case 'newNote': {
      const n = { id:uid('no'), title:isFa()?'یادداشت تازه':'New note', body:'', updated:Date.now(), pinned:false };
      DB.data.notes.unshift(n); DB.save(); noteState.id = n.id; render(); break;
    }
    case 'openNote': noteState.id = id; render(); break;
    case 'closeNote': noteState.id = null; render(); break;
    case 'pinNote': {
      const n = DB.data.notes.find(x=>x.id===noteState.id); if(n){ n.pinned = !n.pinned; DB.save(); render(); }
      break;
    }
    case 'delNote': {
      confirmSheet(t('confirmDel'), ()=>{ DB.data.notes = DB.data.notes.filter(x=>x.id!==noteState.id);
        noteState.id = null; DB.save(); render(); });
      break;
    }
    case 'exportNote': {
      const n = DB.data.notes.find(x=>x.id===noteState.id);
      if(!n) break;
      const html = `<!doctype html><html dir="${isFa()?'rtl':'ltr'}"><head><meta charset="utf-8"><title>${esc(n.title)}</title>
        <style>body{font-family:system-ui,Segoe UI,sans-serif;max-width:720px;margin:36px auto;padding:0 20px;line-height:1.9;color:#16201a}
        h1{font-size:22px} .meta{color:#6c776e;font-size:12px;margin-bottom:18px} blockquote{border-inline-start:3px solid #7fae6b;padding-inline-start:12px;color:#4b564d}</style>
        </head><body><h1>${esc(n.title)}</h1><div class="meta">${fmtDate(new Date(n.updated),{year:true})} — Life Line</div>
        <div>${n.body||''}</div></body></html>`;
      download((n.title||'note').replace(/[^\w\u0600-\u06FF -]+/g,'')+'.html', html, 'text/html');
      toast(t('pdfExported')); break;
    }

    /* pdf */
    case 'pdfNav': {
      if(!pdfState.doc) break;
      pdfState.page = clamp(pdfState.page + Number(el.dataset.dir), 1, pdfState.pages);
      renderPdfPage(); render(); break;
    }
    case 'pdfZoom': {
      pdfState.scale = clamp(pdfState.scale + Number(el.dataset.d)*0.15, .6, 2.6);
      if(pdfState.doc) renderPdfPage(); break;
    }
    case 'pdfManual': manualDocSheet(); break;
    case 'addBookmark': bookmarkSheet(); break;
    case 'addSticky': stickySheet(); break;
    case 'gotoBookmark': {
      const b = DB.data.bookmarks.find(x=>x.id===id);
      if(!b) break;
      pdfState.name = b.doc; pdfState.page = b.page;
      const rec = DB.data.pdfs.find(p=>p.name===b.doc);
      pdfState.pages = pdfState.doc ? pdfState.pages : (rec?.pages || 0);
      closeSheet(); render();
      toast(`${b.doc} → ${t('page')} ${dnum(b.page)}`);
      if(pdfState.doc) renderPdfPage();
      break;
    }
    case 'delBookmark': {
      DB.data.bookmarks = DB.data.bookmarks.filter(x=>x.id!==id); DB.save(); render(); break;
    }
    case 'openRecent': {
      pdfState.name = el.dataset.name; pdfState.pages = Number(el.dataset.pages)||0;
      pdfState.page = DB.data.pdfs.find(p=>p.name===el.dataset.name)?.page || 1;
      if(!pdfState.doc) toast(isFa()?'فایل را دوباره باز کن (فایل محلی در دسترس نیست)':'Reopen the file — the local file is not retained');
      render(); break;
    }

    /* sudoku */
    case 'sdkCell': sudokuState.sel = Number(el.dataset.i); render(); break;
    case 'sdkNum': sdkPlace(Number(el.dataset.n)); break;
    case 'sdkErase': {
      const i = sudokuState.sel;
      if(i!=null && !sudokuState.given[i]){ sudokuState.grid[i]=0; sudokuState.notes[i].clear(); render(); }
      break;
    }
    case 'sdkNotes': sdkNotesMode = !sdkNotesMode; render(); break;
    case 'sdkNew': newSudoku(el.dataset.diff||'easy'); break;
    case 'sdkHint': {
      if(sudokuState.hints <= 0){ toast(isFa()?'راهنما تمام شد':'No hints left'); break; }
      const i = sudokuState.grid.indexOf(0);
      if(i < 0) break;
      const sol = sudokuState.grid.slice(); if(!sdkSolve(sol)) break;
      sudokuState.grid[i] = sol[i]; sudokuState.hints--;
      checkSudokuDone(); render(); break;
    }

    /* assistant */
    case 'sendChat': { sendChat(); break; }
    case 'quickAsk': sendChat(el.dataset.q); break;
    case 'askCompanion': go('assistant'); break;

    /* settings */
    case 'toggleMode': {
      DB.data.profile.mode = DB.data.profile.mode === 'dark' ? 'light' : 'dark';
      DB.save(); applyTheme(); render(); break;
    }
    case 'toggleSetting': {
      const k = el.dataset.key;
      DB.data.profile.settings[k] = !DB.data.profile.settings[k]; DB.save(); render(); break;
    }
    case 'setTheme': {
      DB.data.profile.theme = id;
      const th = THEMES[id];
      if(!th.companions[DB.data.profile.companion]) DB.data.profile.companion = Object.keys(th.companions)[0];
      DB.save(); applyTheme(); render(); toast(L(th.name)); break;
    }
    case 'setCompanion': {
      DB.data.profile.companion = id; DB.save(); render();
      companionSay(companionLine('greeting')); break;
    }
    case 'saveProfile': {
      const p = DB.data.profile;
      p.name = document.getElementById('setName')?.value || p.name;
      p.ageRange = document.getElementById('setAge')?.value || p.ageRange;
      p.availableMinutes = Number(document.getElementById('setTime')?.value || p.availableMinutes);
      p.goal = document.getElementById('setGoal')?.value || p.goal;
      const l = document.getElementById('setLang')?.value;
      if(l && l !== p.lang){ p.lang = l; LANG = l; }
      p.settings.companionChatter = document.getElementById('setChatter')?.value || p.settings.companionChatter;
      p.settings.quietFrom = Number(document.getElementById('setQuietFrom')?.value ?? p.settings.quietFrom);
      p.settings.quietTo = Number(document.getElementById('setQuietTo')?.value ?? p.settings.quietTo);
      const sel = document.getElementById('setLang');
      DB.save(); applyTheme(); render(); toast('✓'); break;
    }
    case 'exportBackup': {
      download('lifeline-backup-'+todayKey()+'.json', DB.export()); toast('✓'); break;
    }
    case 'resetAll': {
      confirmSheet(t('confirmReset'), ()=>{ DB.reset(); LANG = DB.data.profile.lang; view='home'; render(); });
      break;
    }
    case 'companionTap': {
      companionSay(companionLine(pickContext())); break;
    }
    case 'exportReport': exportReport(); break;

    /* onboarding */
    case 'onbTheme': onb.theme = id; onb.companion = Object.keys(THEMES[id].companions)[0]; previewTheme(id); render(); break;
    case 'onbCompanion': onb.companion = id; render(); break;
    case 'onbNext': onbNext(); break;
    case 'onbBack': onb.step = Math.max(0,onb.step-1); render(); break;
    case 'onbSkip': finishOnboarding(true); break;
    case 'onbFinish': finishOnboarding(false); break;
    case 'onbAssessment': assessState = { i:0, answers:[], t0:Date.now() }; view='assessment'; render(); break;
    case 'assessAnswer': {
      assessState.answers[assessState.i] = el.dataset.v;
      assessState.i++;
      if(assessState.i >= ASSESS.length){
        onb.assessment = assessResult();
        DB.data.profile.assessment = onb.assessment;
        DB.save(); view='home'; finishOnboarding(false); toast(isFa()?'ارزیابی ثبت شد':'Assessment saved');
      } else render();
      break;
    }
    case 'assessSkip': { onb.assessment = null; view='home'; finishOnboarding(false); break; }
  }
});

function pickContext(){
  const c = buildContext();
  if(c.overdue.length) return 'missed';
  if(c.habitsToday > c.habitsDone) return 'habit';
  if(c.studyMinToday < 20 && new Date().getHours() > 15) return 'study';
  if(c.focusToday === 0) return 'idle';
  return 'greeting';
}

/* ---------- task CRUD ---------- */
function taskSheet(id){
  const x = DB.data.tasks.find(t=>t.id===id);
  const t2 = x || { title:'', priority:'normal', category:'', day:plannerDate||todayKey(), estimate:25 };
  openSheet(x?t('edit'):t('addTask'), `
    <div class="field"><label>${t('taskTitle')}</label><input id="fTitle" value="${esc(t2.title)}" placeholder="${isFa()?'مثلاً مرور فصل ۴': 'e.g. Review chapter 4'}"/></div>
    <div class="row">
      <div class="field"><label>${t('priority')}</label><select id="fPri">
        <option value="high" ${t2.priority==='high'?'selected':''}>${t('high')}</option>
        <option value="normal" ${t2.priority==='normal'?'selected':''}>${t('normal')}</option>
        <option value="low" ${t2.priority==='low'?'selected':''}>${t('low')}</option></select></div>
      <div class="field"><label>${t('due')}</label><input id="fDay" type="date" value="${t2.day||todayKey()}"/></div>
    </div>
    <div class="row">
      <div class="field"><label>${t('category')}</label><input id="fCat" value="${esc(t2.category||'')}" placeholder="${isFa()?'درس، کار، شخصی…':'study, work, personal…'}"/></div>
      <div class="field"><label>${isFa()?'تخمین (دقیقه)':'Estimate (min)'}</label><input id="fEst" type="number" min="5" step="5" value="${t2.estimate||25}"/></div>
    </div>
    <div class="row" style="margin-top:4px">
      ${x?`<button class="btn danger" data-act="delTask" data-id="${x.id}">${t('del')}</button>`:''}
      <button class="btn ghost block" id="fCancel">${t('cancel')}</button>
      <button class="btn block" id="fSave">${t('save')}</button>
    </div>`, s=>{
    s.querySelector('#fCancel').onclick = closeSheet;
    s.querySelector('#fSave').onclick = ()=>{
      const title = s.querySelector('#fTitle').value.trim();
      if(!title){ toast(isFa()?'عنوان لازم است':'Title required'); return; }
      const payload = {
        title,
        priority: s.querySelector('#fPri').value,
        day: s.querySelector('#fDay').value || todayKey(),
        category: s.querySelector('#fCat').value.trim(),
        estimate: clamp(Number(s.querySelector('#fEst').value||25), 5, 480)
      };
      if(x) Object.assign(x, payload);
      else DB.data.tasks.unshift({ id:uid('tk'), done:false, doneDay:null, created:Date.now(), ...payload });
      DB.save(); closeSheet(); render();
      toast('✓');
    };
    if(x){
      const del = s.querySelector('[data-act="delTask"]');
      if(del) del.onclick = ()=> confirmSheet(t('confirmDel'), ()=>{
        DB.data.tasks = DB.data.tasks.filter(v=>v.id!==x.id);
        if(x.done) XP.revoke(`task:${x.id}:${x.doneDay}`);
        DB.save(); closeSheet(); render();
      });
    }
  });
}
function toggleTask(id){
  const x = DB.data.tasks.find(t=>t.id===id);
  if(!x) return;
  if(x.done){
    x.done = false; XP.revoke(`task:${x.id}:${x.doneDay}`); x.doneDay = null;
    DB.save(); render(); return;
  }
  x.done = true; x.doneDay = todayKey();
  DB.save();
  XP.grant(XP_RATES.task, `task:${x.id}:${x.doneDay}`, x.title);
  spark('+'+XP_RATES.task); bumpCompanion('task');
  checkAchievements(); render();
}

    <div class="row">
      <div class="field"><label>${t('subjectName')}</label><input id="exSub" placeholder="…"/></div>
      <div class="field"><label>${t('examDate')}</label><input id="exDate" type="date" value="${todayKey(new Date(Date.now()+7*86400000))}"/></div>
    </div>
    <div class="row"><button class="btn ghost block" id="exCancel">${t('cancel')}</button>
      <button class="btn block" id="exSave">${t('save')}</button></div>`, s=>{
    s.querySelector('#exCancel').onclick = closeSheet;
    s.querySelector('#exSave').onclick = ()=>{
      const title = s.querySelector('#exTitle').value.trim();
      if(!title){ toast(isFa()?'عنوان لازم است':'Title required'); return; }
      DB.data.exams.push({ id:uid('ex'), title, subject:s.querySelector('#exSub').value.trim(),
        date:s.querySelector('#exDate').value||todayKey(), done:false });
      DB.save(); closeSheet(); render(); toast('✓');
    };
  });
}
function bookmarkSheet(){
  const doc = pdfState.name || 'manual-document.pdf';
  openSheet(t('addBookmark'), `
    <div class="field"><label>${t('title')}</label><input id="bmLabel" placeholder="${isFa()?'مثلاً پاسخ‌های فصل ۲':'e.g. Chapter 2 answers'}"/></div>
    <div class="row">
      <div class="field"><label>${t('page')}</label><input id="bmPage" type="number" min="1" value="${pdfState.page||1}"/></div>
      <div class="field"><label>${isFa()?'رنگ':'Colour'}</label>
        <select id="bmColor">${[['#8fbb75','green'],['#d9b06a','gold'],['#ff3ea5','pink'],['#77b6d9','blue'],['#e2705f','red']]
          .map(([c,n])=>`<option value="${c}">${n}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>${isFa()?'سند':'Document'}</label><input id="bmDoc" value="${esc(doc)}"/></div>
    <div class="row"><button class="btn ghost block" id="bmCancel">${t('cancel')}</button>
      <button class="btn block" id="bmSave">${t('save')}</button></div>`, s=>{
    s.querySelector('#bmCancel').onclick = closeSheet;
    s.querySelector('#bmSave').onclick = ()=>{
      const label = s.querySelector('#bmLabel').value.trim() || (isFa()?'بوکمارک':'Bookmark');
      DB.data.bookmarks.push({ id:uid('bm'), doc:s.querySelector('#bmDoc').value.trim()||doc,
        page: Math.max(1, Number(s.querySelector('#bmPage').value||1)),
        label, color:s.querySelector('#bmColor').value, at:Date.now() });
      DB.save();
      XP.grant(XP_RATES.task, `read:${Date.now()}`, isFa()?'بوکمارک':'Bookmark');
      closeSheet(); checkAchievements(); render(); toast('🔖');
    };
  });
}
function stickySheet(){
  const doc = pdfState.name || 'manual-document.pdf';
  openSheet(isFa()?'یادداشت چسبان':'Sticky note', `
    <div class="field"><label>${t('page')}</label><input id="stPage" type="number" min="1" value="${pdfState.page||1}"/></div>
    <div class="field"><label>${t('notes')}</label><textarea id="stBody" placeholder="${isFa()?'یادداشت این صفحه…':'Note for this page…'}"></textarea></div>
    <div class="row"><button class="btn ghost block" id="stCancel">${t('cancel')}</button>
      <button class="btn block" id="stSave">${t('save')}</button></div>`, s=>{
    s.querySelector('#stCancel').onclick = closeSheet;
    s.querySelector('#stSave').onclick = ()=>{
      const body = s.querySelector('#stBody').value.trim();
      if(!body){ toast(isFa()?'متن لازم است':'Text required'); return; }
      const page = Math.max(1, Number(s.querySelector('#stPage').value||1));
      DB.data.notes.unshift({ id:uid('no'), title:(isFa()?'یادداشت ص ':'Note p.')+page, body:esc(body).replace(/\n/g,'<br>'),
        doc, page, updated:Date.now(), pinned:false });
      DB.save(); closeSheet(); render(); toast('✓');
    };
  });
}
function manualDocSheet(){
  openSheet(isFa()?'افزودن سند دستی':'Add document manually', `
    <p class="tiny muted" style="line-height:1.9;margin:0">
      ${isFa()?'اگر موتور نمایش PDF در دسترس نبود، می‌توانی نام و تعداد صفحه‌ها را ثبت کنی؛ بوکمارک‌ها، شماره صفحه و یادداشت‌ها کامل کار می‌کنند و به همان صفحه می‌پرند.'
        :'If the PDF renderer is unavailable, register the name and page count. Bookmarks, page numbers and notes still work and jump straight to the page.'}
    </p>
    <div class="field"><label>${isFa()?'نام فایل':'File name'}</label><input id="mdName" placeholder="Chemistry.pdf"/></div>
    <div class="field"><label>${isFa()?'تعداد صفحه':'Page count'}</label><input id="mdPages" type="number" min="1" value="10"/></div>
    <div class="row"><button class="btn ghost block" id="mdCancel">${t('cancel')}</button>
      <button class="btn block" id="mdSave">${t('save')}</button></div>`, s=>{
    s.querySelector('#mdCancel').onclick = closeSheet;
    s.querySelector('#mdSave').onclick = ()=>{
      const name = s.querySelector('#mdName').value.trim();
      if(!name){ toast(isFa()?'نام لازم است':'Name required'); return; }
      const pages = Math.max(1, Number(s.querySelector('#mdPages').value||10));
      const rec = DB.data.pdfs.find(p=>p.name===name);
      if(rec){ rec.pages = pages; rec.at = Date.now(); }
      else DB.data.pdfs.push({ id:uid('pdf'), name, pages, page:1, at:Date.now() });
      pdfState.name = name; pdfState.pages = pages; pdfState.page = 1; pdfState.error='';
      DB.save(); closeSheet(); render(); toast('✓');
    };
  });
}

/* ---------- onboarding flow ---------- */
function previewTheme(id){
  const th = THEMES[id];
  Object.entries(th.vars).forEach(([k,v])=> document.documentElement.style.setProperty(k,v));
  document.documentElement.dir = isFa()?'rtl':'ltr';
  document.documentElement.lang = isFa()?'fa':'en';
}
function onbNext(){
  if(onb.step === 3){
    onb.name = document.getElementById('onbName')?.value.trim() || '';
    onb.ageRange = document.getElementById('onbAge')?.value || onb.ageRange;
    onb.minutes = Number(document.getElementById('onbTime')?.value || onb.minutes);
    onb.goal = document.getElementById('onbGoal')?.value || onb.goal;
  }
  onb.step = Math.min(TOTAL_STEPS-1, onb.step+1);
  render();
}
function finishOnboarding(skipped){
  const p = DB.data.profile;
  p.theme = onb.theme; p.companion = onb.companion;
  p.name = onb.name || p.name; p.ageRange = onb.ageRange; p.goal = onb.goal;
  p.availableMinutes = onb.minutes; p.onboarded = true;
  p.settings.companionVisible = true;
  if(onb.assessment) p.assessment = onb.assessment;
  seedStarterContent();
  DB.save(); view = 'home'; render();
  setTimeout(()=>{
    const comp = companionInfo();
    companionSay(isFa()
      ? `${L(comp.name)} اینجاست. یک «کار کوچک» بسازیم و شروع کنیم؟`
      : `${L(comp.name)} is here. Shall we create one small task and start?`, 8000);
  }, 700);
  if(p.settings.sound) chime();
}
function seedStarterContent(){
  const d = DB.data, k = todayKey();
  if(!d.tasks.length && !d.habits.length){
    d.tasks.push({ id:uid('tk'), title:isFa()?'یک کار کوچک را همین امروز تمام کن':'Finish one small task today',
      priority:'normal', day:k, category:isFa()?'شروع':'start', estimate:15, done:false, doneDay:null, created:Date.now() });
    d.tasks.push({ id:uid('tk'), title:isFa()?'۲۵ دقیقه روی مهم‌ترین هدف این هفته کار کن':'Spend 25 minutes on this week’s main goal',
      priority:'high', day:k, category:isFa()?'هدف':'goal', estimate:25, done:false, doneDay:null, created:Date.now() });
    d.habits.push({ id:uid('hb'), title:isFa()?'۱۰ دقیقه مطالعه':'10 minutes of study', freq:'daily', created:Date.now(), archived:false });
    d.habits.push({ id:uid('hb'), title:isFa()?'کشش صبحگاهی':'Morning stretch', freq:'daily', created:Date.now(), archived:false });
    d.subjects.push({ id:uid('sj'), title:isFa()?'درس نمونه':'Sample subject', color:'#8fbb75', created:Date.now() });
    d.notes.push({ id:uid('no'), title:isFa()?'چطور از این اپ استفاده کنم':'How to use this app',
      body:isFa()
        ? '<p>۱. هر روز صبح «برنامه» را باز کن و دو کار مهم بنویس.</p><p>۲. یک پومودورو ۲۵ دقیقه‌ای بزن.</p><p>۳. عادت‌ها را تیک بزن — XP و زنجیره‌ات رشد می‌کند.</p><p>۴. شب، «پیشرفت» را ببین و گزارش بگیر.</p>'
        : '<p>1. Open Planner each morning and write two important tasks.</p><p>2. Run one 25-minute pomodoro.</p><p>3. Tick your habits — XP and streaks grow.</p><p>4. At night, check Progress and export the report.</p>',
      updated:Date.now(), pinned:true });
    DB.save();
  }
}

/* ---------- ambient greeting on load ---------- */
function bootGreeting(){
  const p = DB.data.profile;
  if(!p.onboarded || !p.settings.companionVisible) return;
  if(Date.now() - (p.lastSeen||0) > 1000*60*30){
    setTimeout(()=> companionSay(companionLine('greeting')), 1200);
  }
  p.lastSeen = Date.now(); DB.save();
}

/* ---------- boot ---------- */
let booted=false;
function boot(){
  if(booted) return; booted = true;
  DB.load();
  const p = DB.data.profile;
  LANG = p.lang || 'fa';
  view = 'home';
  applyTheme();
  render();
  bootGreeting();
  window.addEventListener('scroll', ()=>{
    const tb = document.getElementById('topbar');
    if(tb) tb.classList.toggle('scrolled', window.scrollY > 6);
  }, {passive:true});
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape') closeSheet();
    if(e.key === 'Enter' && document.activeElement?.id === 'quickAddInput') quickAdd();
  });
  setInterval(()=>{ // gentle idle companion nudge
    const pr = DB.data.profile;
    if(!pr.onboarded || !pr.settings.companionVisible || pr.settings.companionChatter === 'off') return;
    if(document.visibilityState !== 'visible') return;
    if(Math.random() > 0.25) return;
    companionSay(companionLine(pickContext()), 5200);
  }, 1000*60*6);
}
document.addEventListener('DOMContentLoaded', boot);
if(document.readyState !== 'loading') boot();

</script>
</body>
</html>
