/* =========================================================

   Original work. Games referenced only as *inspiration* for
   colour palettes; no copyrighted assets are bundled.
   ========================================================= */
:root{
  --bg:#0d100e; --bg2:#141916; --surface:#161d19; --surface-2:#1e2722;
  --line:rgba(255,255,255,.09); --text:#eef3ee; --muted:#9aa8a0;
  --primary:#7fae6b; --primary-ink:#0b0f0c; --accent:#c8a15a; --accent-ink:#1a1408;
  --danger:#e2705f; --ok:#6fbf8e; --warn:#e0b552;
  --radius:20px; --radius-sm:12px; --radius-lg:28px;
  --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  --glow:0 0 0 0 transparent;
  --font:"Vazirmatn","IRANSans","Segoe UI",system-ui,-apple-system,"Noto Sans",sans-serif;
  --font-head:"Vazirmatn","Segoe UI",system-ui,sans-serif;
  --pattern:none;
  --nav-h:74px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:var(--text);
  background:
    radial-gradient(1200px 700px at 80% -10%,color-mix(in srgb,var(--primary) 16%,transparent),transparent 60%),
    radial-gradient(900px 600px at -10% 110%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  transition:background .45s ease,color .3s ease;
  overscroll-behavior:none;
}
body::before{content:"";position:fixed;inset:0;background-image:var(--pattern);background-size:18px 18px;opacity:.5;pointer-events:none;z-index:0}
img,svg{display:block}
button{font-family:inherit}
::selection{background:color-mix(in srgb,var(--primary) 45%,transparent)}

/* ---------- shell ---------- */
.app-shell{
  position:relative;z-index:1;width:100%;max-width:620px;min-height:100dvh;margin:0 auto;
  display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg) 82%,transparent);
}
@media(min-width:760px){
  body{padding:0;}
  .app-shell{border-inline:1px solid var(--line);box-shadow:0 0 80px -30px #000;}
}
.topbar{
  position:sticky;top:0;z-index:40;padding:14px 18px 10px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 96%,transparent),color-mix(in srgb,var(--bg) 70%,transparent));
  backdrop-filter:blur(14px);border-bottom:1px solid transparent;
}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px;font-family:var(--font-head)}
.topbar .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.topbar .grow{flex:1;min-width:0}
.icon-btn{
  width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:12px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--text);transition:.18s;
}
.icon-btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.95)}
.content{flex:1;padding:14px 18px calc(var(--nav-h) + 96px);display:flex;flex-direction:column;gap:14px;animation:viewIn .32s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;height:var(--nav-h);max-width:620px;margin:0 auto;
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom);
}
@media(min-width:760px){.bottomnav{left:50%;transform:translateX(-50%);width:620px;border:1px solid var(--line);border-bottom:none}}
.nav-item{
  border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:10.5px;font-weight:600;padding:8px 0;cursor:pointer;transition:.2s;position:relative;
}
.nav-item svg{width:22px;height:22px}
.nav-item.active{color:var(--primary)}
.nav-item.active::after{content:"";position:absolute;bottom:2px;width:16px;height:3px;border-radius:3px;background:var(--primary)}
.nav-item:active{transform:scale(.94)}

/* ---------- cards ---------- */
.card{
  background:linear-gradient(160deg,var(--surface),color-mix(in srgb,var(--surface-2) 70%,var(--surface)));
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.card.tight{padding:12px}
.card.flat{box-shadow:none;background:var(--surface)}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-head h3{margin:0;font-size:14.5px;font-weight:800;flex:1;font-family:var(--font-head)}
.card-head .hint{font-size:11px;color:var(--muted);font-weight:600}
.section-title{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:800;margin:6px 2px -4px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;cursor:pointer;
  background:var(--primary);color:var(--primary-ink);font-weight:800;font-size:13.5px;
  padding:12px 16px;border-radius:14px;transition:.18s;box-shadow:0 8px 20px -12px var(--primary);
}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--text);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{background:color-mix(in srgb,var(--surface-2) 70%,var(--primary))}
.btn.soft{background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 35%,transparent);box-shadow:none}
.btn.danger{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}

/* ---------- inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.field label{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.3px}
input,textarea,select{
  width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:11px 12px;font-size:14px;font-family:inherit;outline:none;transition:.18s;
}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
textarea{resize:vertical;min-height:76px;line-height:1.65}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir=rtl] select{background-position:18px 50%,23px 50%}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:.16s;
}
.chip.on{background:color-mix(in srgb,var(--primary) 20%,transparent);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 45%,transparent)}
.chip.static{cursor:default}
.switch{width:44px;height:26px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;cursor:pointer;transition:.2s;flex:0 0 44px}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:color-mix(in srgb,var(--primary) 30%,transparent);border-color:var(--primary)}
.switch.on::after{background:var(--primary);transform:translateX(18px)}
[dir=rtl] .switch.on::after{transform:translateX(-18px)}

/* ---------- progress ---------- */
.progress{height:9px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.progress > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .6s cubic-bezier(.2,.9,.2,1)}
.pill{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pill.pri{color:var(--primary);border-color:color-mix(in srgb,var(--primary) 40%,transparent);background:color-mix(in srgb,var(--primary) 12%,transparent)}

/* ---------- list items ---------- */
.item{
  display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);
}
.item:last-child{border-bottom:0}
.item .txt{flex:1;min-width:0}
.item .t1{font-size:13.5px;font-weight:700;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t2{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item.done .t1{text-decoration:line-through;color:var(--muted)}
.check{
  width:26px;height:26px;flex:0 0 26px;border-radius:9px;border:1.6px solid var(--line);display:grid;place-items:center;
  cursor:pointer;color:transparent;transition:.18s;background:var(--bg2);
}
.check:hover{border-color:var(--primary)}
.check.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.check svg{width:15px;height:15px}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.9}
.empty .big{font-size:26px;margin-bottom:6px}

/* ---------- stat tiles ---------- */
.grid{display:grid;gap:10px}
.grid.g2{grid-template-columns:1fr 1fr}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat .v{font-size:20px;font-weight:900;font-family:var(--font-head);letter-spacing:-.5px}
.stat .k{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:700}
@media(max-width:380px){.grid.g4{grid-template-columns:1fr 1fr}}

/* ---------- hero / level ---------- */
.hero{
  border-radius:var(--radius-lg);padding:18px;position:relative;overflow:hidden;
  background:
    radial-gradient(120% 130% at 100% 0%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 55%),
    linear-gradient(150deg,color-mix(in srgb,var(--primary) 24%,var(--surface)),var(--surface));
  border:1px solid color-mix(in srgb,var(--primary) 30%,var(--line));
}
.hero .lvl{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.lvl-ring{
  width:60px;height:60px;flex:0 0 60px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--accent) calc(var(--p) * 1%),color-mix(in srgb,var(--text) 10%,transparent) 0);
  font-weight:900;font-size:15px;
}
.lvl-ring i{position:absolute;inset:4px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal}
.hero h2{margin:0;font-size:17px;font-weight:900;font-family:var(--font-head)}
.hero .muted{color:var(--muted);font-size:11.5px;margin-top:3px}

/* ---------- XP bar ---------- */
.xpbar{height:12px;border-radius:99px;background:rgba(0,0,0,.32);overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.12)}
.xpbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .7s cubic-bezier(.2,.9,.2,1)}
.xpbar > span{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;font-weight:800;letter-spacing:.4px;text-shadow:0 1px 2px rgba(0,0,0,.6)}

/* ---------- rings (dashboard) ---------- */
.ringwrap{display:flex;gap:8px;justify-content:space-between}
.mini-ring{flex:1;text-align:center}
.mini-ring .r{width:56px;height:56px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;
  background:conic-gradient(var(--primary) calc(var(--p) * 1%),color-mix(in srgb,var(--text) 9%,transparent) 0);}
.mini-ring .r i{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal}
.mini-ring .k{font-size:10.5px;color:var(--muted);margin-top:6px;font-weight:700}

/* ---------- companion ---------- */
.companion-dock{
  position:fixed;bottom:calc(var(--nav-h) + 12px);inset-inline-end:14px;z-index:45;
  display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:min(280px, calc(100% - 28px));
}
@media(min-width:760px){.companion-dock{bottom:calc(var(--nav-h) + 18px);position:sticky;float:none}}
.companion-bubble{
  order:-1;background:var(--surface);border:1px solid color-mix(in srgb,var(--primary) 35%,var(--line));border-radius:16px 16px 4px 16px;
  padding:10px 13px;font-size:12.5px;line-height:1.75;max-width:230px;box-shadow:var(--shadow);animation:pop .28s ease both;
}
[dir=rtl] .companion-bubble{border-radius:16px 16px 16px 4px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
.companion-avatar{
  width:54px;height:54px;flex:0 0 54px;border-radius:18px;cursor:pointer;overflow:hidden;
  background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid color-mix(in srgb,var(--primary) 40%,var(--line));
  box-shadow:0 10px 26px -12px var(--primary);transition:.2s;position:relative;padding:3px;
}
.companion-avatar:hover{transform:translateY(-2px) scale(1.03)}
.companion-avatar svg{width:100%;height:100%}
.companion-avatar .badge{position:absolute;top:-3px;inset-inline-end:-3px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}

/* ---------- modal / sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:620px;max-height:88dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.2,1) both;
  box-shadow:0 -20px 50px -20px #000;display:flex;flex-direction:column;gap:12px;
}
@media(min-width:760px){.scrim{align-items:center}.sheet{border-radius:24px;max-height:82dvh}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0;font-size:16px;font-weight:900;font-family:var(--font-head)}
.sheet .grab{width:44px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 2px}
.toast-wrap{position:fixed;top:14px;left:0;right:0;z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{
  background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:12.5px;font-weight:700;
  box-shadow:var(--shadow);animation:toastIn .3s ease both;display:flex;gap:8px;align-items:center;max-width:88vw;
}
.toast.gold{border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

/* ---------- heatmap ---------- */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:4px;background:color-mix(in srgb,var(--text) 7%,transparent);display:block}
.heat i.l1{background:color-mix(in srgb,var(--primary) 30%,transparent)}
.heat i.l2{background:color-mix(in srgb,var(--primary) 55%,transparent)}
.heat i.l3{background:color-mix(in srgb,var(--primary) 78%,transparent)}
.heat i.l4{background:var(--primary)}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{text-align:center;font-size:10px;color:var(--muted);font-weight:800;padding:2px 0}
.cal .day{
  aspect-ratio:1;border-radius:11px;border:1px solid transparent;background:var(--surface-2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;position:relative;
}
.cal .day.out{opacity:.3}
.cal .day.today{border-color:var(--primary)}
.cal .day.sel{background:var(--primary);color:var(--primary-ink)}
.cal .day .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);position:absolute;bottom:5px}
.cal .day.sel .dot{background:var(--primary-ink)}

/* ---------- timer ---------- */
.timer-wrap{display:grid;place-items:center;gap:14px;padding:6px 0}
.timer-dial{
  width:220px;height:220px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--primary) calc(var(--p) * 1%),color-mix(in srgb,var(--text) 8%,transparent) 0);
  box-shadow:inset 0 0 40px -18px var(--primary),0 20px 40px -25px var(--primary);
}
.timer-dial::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.timer-dial .t{position:relative;z-index:2;font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px;font-family:var(--font-head)}
.timer-dial .m{position:relative;z-index:2;font-size:11px;color:var(--muted);margin-top:4px}

/* ---------- sudoku ---------- */
.sgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;background:var(--line);padding:2px;border-radius:14px;overflow:hidden}
.sgrid .c{
  aspect-ratio:1;display:grid;place-items:center;background:var(--surface);font-size:16px;font-weight:700;cursor:pointer;
  color:var(--primary);transition:.12s;position:relative;font-variant-numeric:tabular-nums;
}
.sgrid .c.given{background:var(--surface-2);color:var(--text);font-weight:900}
.sgrid .c.sel{background:color-mix(in srgb,var(--primary) 30%,var(--surface))}
.sgrid .c.peer{background:color-mix(in srgb,var(--primary) 9%,var(--surface))}
.sgrid .c.err{color:var(--danger)}
.sgrid .c small{font-size:8.5px;color:var(--muted);position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center;font-weight:600;line-height:1}
.sgrid .c:nth-child(3n){border-inline-end:2px solid var(--line)}
.sgrid .c:nth-child(n+19):nth-child(-n+27),.sgrid .c:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--line)}
.skeys{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.skeys button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-weight:800;font-size:15px;cursor:pointer}
.skeys button:active{transform:scale(.94)}

/* ---------- notebook ---------- */
.note-body{font-size:14px;line-height:1.95;min-height:300px;padding:16px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);outline:none}
.note-body:empty::before{content:attr(data-ph);color:var(--muted)}
.note-body h2{font-size:17px;margin:.6em 0 .3em}
.note-body blockquote{border-inline-start:3px solid var(--primary);margin:.6em 0;padding-inline-start:10px;color:var(--muted)}
.note-body ul{padding-inline-start:20px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:var(--surface-2);border-radius:14px;border:1px solid var(--line)}
.toolbar button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:7px 9px;font-size:12px;font-weight:800;cursor:pointer}
.toolbar button:hover{background:var(--surface);color:var(--text)}

/* ---------- pdf ---------- */
.pdf-stage{background:#20242a;border-radius:14px;min-height:340px;display:grid;place-items:center;overflow:auto;padding:10px;border:1px solid var(--line)}
.pdf-stage canvas{max-width:100%;border-radius:6px;box-shadow:0 10px 30px -12px #000;background:#fff}
.bm{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;margin-bottom:9px}
.bm:hover{border-color:var(--primary)}
.bm .cdot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.bm .pg{font-size:10.5px;color:var(--muted);font-weight:800}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;overflow:visible}
.bars{display:flex;align-items:flex-end;gap:5px;height:34px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars .b i{width:100%;flex:0 0 auto;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--primary),color-mix(in srgb,var(--primary) 35%,transparent));min-height:3px;transition:height .5s ease}
.bars .b span{font-size:9px;color:var(--muted);font-weight:700}

/* ---------- onboarding ---------- */
.onb{min-height:100dvh;display:flex;flex-direction:column;gap:16px;padding:24px 20px 30px;max-width:620px;margin:0 auto;position:relative;z-index:1}
.onb .logo{font-size:12px;letter-spacing:5px;font-weight:900;color:var(--primary);text-transform:uppercase}
.onb h1{font-size:30px;line-height:1.28;margin:0;font-weight:900;letter-spacing:-.5px;font-family:var(--font-head)}
.onb p.lead{color:var(--muted);font-size:13.5px;line-height:2;margin:0}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-card{
  border-radius:18px;padding:12px;border:1.5px solid var(--line);cursor:pointer;position:relative;overflow:hidden;
  background:var(--surface);transition:.2s;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;
}
.theme-card:hover{transform:translateY(-2px)}
.theme-card.on{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}
.theme-card .sw{position:absolute;top:0;left:0;right:0;height:44px;display:flex}
.theme-card .sw i{flex:1}
.theme-card b{font-size:13px;font-weight:900;font-family:var(--font-head)}
.theme-card small{font-size:10px;color:var(--muted)}
.steps{display:flex;gap:6px;margin-bottom:4px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--surface-2)}
.steps i.on{background:var(--primary)}
.opt{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer;transition:.16s}
.opt:hover{border-color:color-mix(in srgb,var(--primary) 50%,var(--line))}
.opt.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--surface))}
.opt .o1{font-size:13.5px;font-weight:800}
.opt .o2{font-size:11px;color:var(--muted);margin-top:2px}

/* assistant chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:13px;line-height:1.95;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-bottom-inset-end-radius:4px;border-radius:16px 16px 4px 16px;font-weight:600}
.msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:16px 16px 16px 4px}
.msg .tag{display:inline-block;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:900;color:var(--accent);margin-bottom:5px}
.chat-bar{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:calc(var(--nav-h) + 8px);background:linear-gradient(to top,var(--bg) 40%,transparent);padding-top:10px}
.chat-bar input{flex:1}
.quick-asks{display:flex;gap:7px;flex-wrap:wrap}

/* misc */
.muted{color:var(--muted)}
.tiny{font-size:11px}
.center{text-align:center}
.right{text-align:end}
.hidden{display:none!important}
.sep{height:1px;background:var(--line);margin:2px 0}
.badge-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}
.kv b{font-weight:800}
.credit{font-size:10.5px;color:var(--muted);text-align:center;padding:6px 0 2px;letter-spacing:.3px}
.spark{position:fixed;pointer-events:none;z-index:200;font-size:16px;font-weight:900;color:var(--accent);animation:sparkUp 1.1s ease-out forwards}
@keyframes sparkUp{to{transform:translateY(-70px) scale(1.25);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* ---------- icon sizing (inline SVG) ---------- */
.btn svg{width:17px;height:17px;flex:0 0 auto}
.btn.sm svg{width:14px;height:14px}
.icon-btn svg{width:18px;height:18px}
.check svg{width:15px;height:15px}
.card-head svg{width:15px;height:15px}
.pill svg{width:12px;height:12px}
.item svg{width:16px;height:16px;color:var(--muted)}
.nav-item svg{width:22px;height:22px}
.tiny svg{width:13px;height:13px}

</style>
</head>

/* ---------- toast / spark ---------- */
function toast(msg, kind=''){
  let wrap = document.querySelector('.toast-wrap');
  if(!wrap){ wrap = document.createElement('div'); wrap.className='toast-wrap'; document.body.appendChild(wrap); }
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg; wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(-8px)'; el.style.transition='.3s'; }, 2100);
  setTimeout(()=> el.remove(), 2500);
}

  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <h3>${esc(title)}</h3>
    <div class="sheet-body">${bodyHTML}</div>

  document.body.appendChild(scrim);
  scrim.addEventListener('click', e=>{ if(e.target===scrim) closeSheet(); });
  const s = scrim.querySelector('.sheet');
  s.addEventListener('click', e=> e.stopPropagation());

}

function download(filename, content, type='application/json'){

const DB_KEY = 'lifeline.db.v3';
const DB = {
  data: null,
  load(){
    try{
      const raw = localStorage.getItem(DB_KEY);
      this.data = raw ? JSON.parse(raw) : null;
    }catch(e){ this.data = null; }
    if(!this.data) this.data = this.blank();
    return this.data;
  },
  blank(){
    return {
      meta:{ version:3, created:Date.now(), schema:'lifeline-v3' },
      profile:{ name:'', ageRange:'18-24', goal:'study', theme:'overgrown', companion:'warden',
        lang:'fa', mode:'dark', availableMinutes:60, onboarded:false, assessment:null,
        settings:{ companionVisible:true, companionChatter:'normal', sound:true, quietFrom:22, quietTo:7,
                   notifications:true, reduceMotion:false, personalized:true } },
      tasks:[], habits:[], habitRecords:[], subjects:[], sessions:[], exams:[],
      notes:[], pdfs:[], bookmarks:[], focus:[], xp:[], missions:[], achievements:[],
      chats:[], sudoku:[], audioPresets:[], journal:[]
    };
  },
  save(){
    try{ localStorage.setItem(DB_KEY, JSON.stringify(this.data)); }
    catch(e){ toast(t('saveFail')); }
  },
  reset(){ localStorage.removeItem(DB_KEY); this.data = this.blank(); this.save(); },
  export(){ return JSON.stringify(this.data, null, 2); },
  import(json){
    const d = JSON.parse(json);
    if(!d || !d.meta || d.meta.schema !== 'lifeline-v3') throw new Error('bad-schema');
    this.data = Object.assign(this.blank(), d);
    this.save();
  }

/* ---------- helpers ---------- */
const uid = (p='id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayKey = (d=new Date()) => {
  const x = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return x.toISOString().slice(0,10);
};
const dayDiff = (a,b) => Math.round((new Date(b+'T00:00') - new Date(a+'T00:00'))/86400000);
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
const sum = arr => arr.reduce((a,b)=>a+b,0);
const fmtNum = n => (new Intl.NumberFormat(DB.data?.profile.lang==='fa'?'fa-IR':'en-US').format(n));

/* ---------- XP engine (anti-abuse: one grant per source key) ---------- */
const XP_RATES = { task:15, habit:10, session:30, daily:25, weekly:100, exam:50, sudoku:20 };

const XP = {
  grant(amount, reasonKey, label){
    const d = DB.data;
    if(!amount || amount <= 0) return false;
    if(reasonKey && d.xp.some(x => x.key === reasonKey)) return false;  // no duplicate rewards
    d.xp.push({ id:uid('xp'), at:Date.now(), day:todayKey(), amount, key:reasonKey||null, label:label||'' });
    DB.save();
    const before = XP.level().level;
    const after = XP.level().level;
    if(after > before) onLevelUp(after);
    return true;
  },
  revoke(reasonKey){
    const d = DB.data, n = d.xp.length;
    d.xp = d.xp.filter(x => x.key !== reasonKey);
    if(d.xp.length !== n){ DB.save(); return true; }
    return false;
  },
  total(){ return sum(DB.data.xp.map(x=>x.amount)); },
  /* level curve: 120 XP for lvl2, growing ~18% */
  need(level){ return Math.round(120 * Math.pow(1.18, level-1) / 5) * 5; },
  level(){
    let total = XP.total(), level = 1, rest = total;
    while(rest >= XP.need(level)){ rest -= XP.need(level); level++; }
    return { level, into:rest, need:XP.need(level), total };
  },
  today(){ const k = todayKey(); return sum(DB.data.xp.filter(x=>x.day===k).map(x=>x.amount)); },
  byDay(n=14){
    const out = [];
    for(let i=n-1;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const k = todayKey(d);
      out.push({ key:k, v: sum(DB.data.xp.filter(x=>x.day===k).map(x=>x.amount)) });
    }
    return out;
  }
};

function onLevelUp(level){
  DB.data.achievements.push({ id:uid('ach'), at:Date.now(), key:'level_'+level, title:`Level ${level}` });

/* ---------- habit helpers ---------- */
function habitStreak(h){
  const recs = new Set(DB.data.habitRecords.filter(r=>r.habitId===h.id && r.done).map(r=>r.day));
  let n = 0, d = new Date();
  // allow today to be optional
  if(!recs.has(todayKey(d))) d.setDate(d.getDate()-1);
  while(recs.has(todayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function habitDoneToday(h){ return DB.data.habitRecords.some(r=>r.habitId===h.id && r.day===todayKey() && r.done); }
function toggleHabit(h){
  const d = DB.data, k = todayKey();
  const rec = d.habitRecords.find(r=>r.habitId===h.id && r.day===k);
  if(rec && rec.done){
    rec.done = false; XP.revoke(`habit:${h.id}:${k}`); DB.save();
  }else{
    if(rec) rec.done = true; else d.habitRecords.push({ id:uid('hr'), habitId:h.id, day:k, done:true });
    DB.save(); XP.grant(XP_RATES.habit, `habit:${h.id}:${k}`, h.title); spark('+'+XP_RATES.habit); bumpCompanion('habit');
  }
  checkAchievements(); render();
}
function habitRate(h, days=30){
  const start = new Date(); start.setDate(start.getDate()-days+1);
  const recs = DB.data.habitRecords.filter(r=>r.habitId===h.id && r.done && dayDiff(r.day, todayKey()) < days);
  return Math.round((recs.length/days)*100);
}

/* ---------- mission engine (daily/weekly, deterministic per period) ---------- */
function periodKey(weekly){
  const d = new Date();
  if(!weekly) return todayKey(d);
  const first = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d-first)/86400000) + first.getDay()+1)/7);
  return d.getFullYear()+'-W'+week;
}
const MISSION_POOL = [
  { id:'tasks3', kind:'daily', need:3, metric:'tasks', xp:25, fa:'۳ کار را تمام کن', en:'Finish 3 tasks' },
  { id:'habit2', kind:'daily', need:2, metric:'habits', xp:25, fa:'۲ عادت را تیک بزن', en:'Complete 2 habits' },
  { id:'focus1', kind:'daily', need:1, metric:'focus', xp:30, fa:'یک پومودورو کامل کن', en:'Finish one pomodoro' },
  { id:'read1', kind:'daily', need:1, metric:'read', xp:20, fa:'در PDF یک بوکمارک بگذار', en:'Drop a bookmark in a PDF' },
  { id:'study1', kind:'daily', need:1, metric:'study', xp:30, fa:'یک جلسهٔ مطالعه ثبت کن', en:'Log one study session' },
  { id:'tasks10', kind:'weekly', need:10, metric:'tasksW', xp:100, fa:'۱۰ کار در این هفته', en:'10 tasks this week' },
  { id:'study180', kind:'weekly', need:180, metric:'studyMinW', xp:120, fa:'۳ ساعت مطالعه در هفته', en:'Study 3 hours this week' },
  { id:'habit5', kind:'weekly', need:5, metric:'habitW', xp:110, fa:'۵ روز عادت‌ها را کامل کن', en:'5 habit days this week' }
];
const METRICS = {
  tasks:()=>DB.data.tasks.filter(x=>x.done && x.doneDay===todayKey()).length,
  habits:()=>DB.data.habitRecords.filter(r=>r.day===todayKey()&&r.done).length,
  focus:()=>DB.data.focus.filter(f=>f.kind==='pomodoro'&&f.done&&todayKey(new Date(f.at))===todayKey()).length,
  read:()=>DB.data.bookmarks.filter(b=>todayKey(new Date(b.at))===todayKey()).length,
  study:()=>DB.data.sessions.filter(s=>s.day===todayKey()).length,
  tasksW:()=>{
    const start = new Date(); start.setDate(start.getDate()-((start.getDay()+6)%7));
    return DB.data.tasks.filter(x=>x.done && x.doneDay && dayDiff(x.doneDay, todayKey())<=((new Date().getDay()+6)%7)).length;
  },
  studyMinW:()=>{
    const start = new Date(); start.setDate(start.getDate()-((start.getDay()+6)%7));
    return sum(DB.data.sessions.filter(s=>dayDiff(s.day, todayKey())<=((new Date().getDay()+6)%7)).map(s=>s.minutes));
  },
  habitW:()=>{
    const set = new Set(DB.data.habitRecords.filter(r=>r.done && dayDiff(r.day,todayKey())<=6).map(r=>r.day));
    return set.size;
  }
};
function missionsFor(kind){
  const pk = periodKey(kind!=='daily');
  const pool = MISSION_POOL.filter(m=>m.kind===kind);
  const d = DB.data;
  pool.forEach(m=>{
    const key = `${m.id}:${pk}`;
    if(!d.missions.some(x=>x.key===key)) d.missions.push({ id:uid('ms'), key, missionId:m.id, kind, period:pk, xp:m.xp, at:Date.now() });
  });
  // prune old mission rows (keep achievement records small)
  d.missions = d.missions.filter(x=>dayDiff(x.period.length===10?x.period:todayKey(), todayKey()) < 40);
  DB.save();
  return pool.map(m=>{
    const cur = METRICS[m.metric]();
    const rec = d.missions.find(x=>x.key===`${m.id}:${pk}`);
    const claimed = !!rec?.claimed;
    const done = cur >= m.need;
    return { ...m, cur:Math.min(cur,m.need), claimed, done };
  });
}
function claimMission(m){
  const pk = periodKey(m.kind!=='daily');
  const rec = DB.data.missions.find(x=>x.key===`${m.id}:${pk}`);
  if(!rec || rec.claimed || !m.done) return;
  rec.claimed = true; rec.claimedAt = Date.now(); DB.save();
  XP.grant(m.xp, `mission:${rec.key}`, m.en);
  toast(tf('missionDone',{n:fmtNum(m.xp)}), 'gold'); spark('★'); checkAchievements(); render();
}

/* ---------- tiny audio engine (WebAudio, no external files) ---------- */
let AC = null, activeAudio = {};
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function noiseBuffer(ctx){
  const len = ctx.sampleRate * 3, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  let last = 0;
  for(let i=0;i<len;i++){
    const white = Math.random()*2-1;
    last = (last + 0.02*white)/1.02;   // brown-ish
    d[i] = last*3.2;
  }
  return buf;
}
const SOUNDS = {
  rain:{ fa:'باران', en:'Rain', filter:{type:'bandpass',freq:1800,q:.5} },
  forest:{ fa:'جنگل', en:'Forest', filter:{type:'lowpass',freq:900,q:.6} },
  river:{ fa:'رودخانه', en:'River', filter:{type:'lowpass',freq:600,q:.7} },
  fire:{ fa:'شومینه', en:'Fireplace', filter:{type:'bandpass',freq:700,q:.8} },
  wind:{ fa:'باد', en:'Wind', filter:{type:'lowpass',freq:420,q:.5} },
  white:{ fa:'نویز سفید', en:'White noise', filter:{type:'highpass',freq:300,q:.4} }
};
function playSound(id, vol=.5){
  if(activeAudio[id]) return;
  const ctx = ac(); if(!ctx) return;
  if(ctx.state==='suspended') ctx.resume();
  const src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx); src.loop = true;
  const f = ctx.createBiquadFilter(); const cfg = SOUNDS[id].filter;
  f.type = cfg.type; f.frequency.value = cfg.freq; f.Q.value = cfg.q;
  const g = ctx.createGain(); g.gain.value = vol*0.25;
  src.connect(f).connect(g).connect(ctx.destination); src.start();
  const lfo = ctx.createOscillator(), lg = ctx.createGain();
  lfo.frequency.value = 0.08 + Math.random()*0.12; lg.gain.value = vol*0.09;
  lfo.connect(lg).connect(g.gain); lfo.start();
  activeAudio[id] = { src, g, lfo, vol };
}
function setSoundVol(id, vol){
  const a = activeAudio[id]; if(!a) return;
  a.g.gain.value = vol*0.25; a.lfo.gain.value = vol*0.09; a.vol = vol;
}
function stopSound(id){
  const a = activeAudio[id]; if(!a) return;
  try{ a.src.stop(); a.lfo.stop(); }catch(e){}
  delete activeAudio[id];
}
function stopAllSounds(){ Object.keys(activeAudio).forEach(stopSound); }
function chime(){
  const ctx = ac(); if(!ctx) return;
  if(ctx.state==='suspended') ctx.resume();
  [523.25, 659.25, 783.99].forEach((f,i)=>{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value=f;
    const t = ctx.currentTime + i*0.09;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.12,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+.5);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+.55);
  });
}

let lastLine = '';
function companionLine(context, extra={}){
  const info = companionInfo();
  const fam = FAMILY_LINES[info.family] || FAMILY_LINES.calm;
  const pool = (fam[context] || fam.idle)[LANG] || fam.idle.en;
  let line = pool[Math.floor(Math.random()*pool.length)];
  line = line.replace('{n}', fmtNum(extra.n ?? XP.level().level));
  if(line === lastLine && pool.length > 1) line = pool[(pool.indexOf(line)+1)%pool.length];
  lastLine = line;
  return line;

function greetingContext(){
  const h = new Date().getHours();
  if(h < 12) return 'greeting';
  return 'greeting';
}
function companionSay(text, ms=6500){
  const b = document.getElementById('compBubble');
  if(!b) return;
  const p = DB.data.profile;
  if(!p.settings.companionVisible) return;
  const h = new Date().getHours();
  const quiet = p.settings.quietFrom > p.settings.quietTo
    ? (h >= p.settings.quietFrom || h < p.settings.quietTo)
    : (h >= p.settings.quietFrom && h < p.settings.quietTo);
  b.textContent = text;
  b.classList.remove('hidden');
  clearTimeout(companionSay._t);
  companionSay._t = setTimeout(()=> b.classList.add('hidden'), quiet ? Math.min(ms,3500) : ms);
}
function bumpCompanion(context){
  const freq = DB.data.profile.settings.companionChatter;
  if(freq === 'off') return;
  if(freq === 'low' && Math.random() > .4) return;
  companionSay(companionLine(context), 6000);
}


/* ===== ai.js ===== */
/* =========================================================
   LIFE LINE — offline assistant ("Local Context + Rule Engine")
   No network. No API keys. Every answer is computed from the
   user's own local records. Clearly labelled as rule-based.
   ========================================================= */

/* ---------- context builder: facts the engine can reason about ---------- */
function buildContext(){
  const d = DB.data, k = todayKey();
  const openTasks = d.tasks.filter(x=>!x.done);
  const todayTasks = d.tasks.filter(x=>x.day === k);
  const overdue = openTasks.filter(x=> x.day && dayDiff(x.day, k) > 0);
  const habits = d.habits.filter(h=>!h.archived);
  const habitsToday = habits.length;
  const habitsDone = habits.filter(h=>habitDoneToday(h)).length;
  const studyMinToday = sum(d.sessions.filter(s=>s.day===k).map(s=>s.minutes));
  const studyMin7 = sum(d.sessions.filter(s=>dayDiff(s.day,k) < 7).map(s=>s.minutes));
  const focusToday = d.focus.filter(f=>f.kind==='pomodoro' && f.done && todayKey(new Date(f.at))===k).length;
  const lvl = XP.level();
  const nextExam = d.exams.filter(e=>!e.done && dayDiff(k, e.date) >= 0).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const weakestHabit = habits.slice().sort((a,b)=>habitRate(a,14)-habitRate(b,14))[0];
  const bestHabit = habits.slice().sort((a,b)=>habitRate(b,14)-habitRate(a,14))[0];
  const taskRate7 = (()=>{
    const done7 = d.tasks.filter(t=>t.done && t.doneDay && dayDiff(t.doneDay,k)<7).length;
    const created7 = d.tasks.filter(t=>dayDiff(t.day||k,k)<7).length || 1;
    return Math.round((done7/created7)*100);
  })();
  return { d,k,openTasks,todayTasks,overdue,habits,habitsToday,habitsDone,studyMinToday,studyMin7,
    focusToday,lvl,nextExam,weakestHabit,bestHabit,taskRate7, available: d.profile.availableMinutes||60 };
}

/* ---------- intent detection (bilingual keyword scoring) ---------- */
const INTENTS = [
  { id:'plan',     kw:['برنامه','چه کنم','امروز چه','پلن','plan','what should i','schedule','priority','اولویت','بچین'] },
  { id:'progress', kw:['وضعیت','پیشرفت','چطور','چقدر','progress','how am i','status','xp','سطح','level'] },
  { id:'habits',   kw:['عادت','streak','habit','زنجیره','consistency','پیوستگی'] },
  { id:'study',    kw:['مطالعه','درس','آزمون','امتحان','study','exam','revise','مرور','برنامهٔ مطالعه'] },
  { id:'missed',   kw:['عقب','جامانده','قضا','missed','overdue','دیرکرد','منتقل'] },
  { id:'quiz',     kw:['کوییز','سؤال بساز','تست','quiz','question','آزمونک'] },
  { id:'summary',  kw:['خلاصه','summar','جمع‌بندی','note','یادداشت'] },
  { id:'feature',  kw:['چطور کار','چه کار می‌کند','help','راهنما','how do i','چه‌طور','امکانات'] },
  { id:'motivate', kw:['انگیزه','خسته','بی‌حوصله','tired','motivat','نمی‌توانم','حوصله'] },
  { id:'break',    kw:['استراحت','break','rest','خستگی'] }
];
function detectIntent(text){
  const q = text.toLowerCase();
  let best = { id:'plan', score:0 };
  INTENTS.forEach(i=>{
    const score = i.kw.reduce((a,k)=> a + (q.includes(k)? k.length>=4?2:1 : 0), 0);
    if(score > best.score) best = { id:i.id, score };
  });
  return best.score ? best.id : 'plan';
}

/* ---------- answer builders ---------- */
function answerPlan(c){
  const lines = [];
  const pend = c.openTasks.filter(t=>!t.day || t.day <= c.k);
  const sorted = sortTasks(pend).slice(0, 4);
  const timeBudget = c.available;
  lines.push(isFa() ? `بر اساس ${dnum(timeBudget)} دقیقهٔ آزادی که ثبت کرده‌ای، پیشنهاد من این ترتیب است:` :
                      `Based on the ${dnum(timeBudget)} minutes you recorded, here is my order:`);
  let used = 0;
  sorted.forEach((tk,i)=>{
    const est = tk.estimate || 25;
    if(used + est > timeBudget && i > 0) return;
    used += est;
    lines.push(`${isFa()?dnum(i+1):i+1}. ${tk.title} — ${dnum(est)} ${t('minutes')}${tk.priority==='high' && isFa()?' (اولویت بالا)':''}${tk.priority==='high' && !isFa()?' (high)':''}`);
  });
  if(!sorted.length) lines.push(isFa()?'کاری در صف نیست؛ یک کار جدید بساز یا یک عادت را کامل کن.':'Nothing queued — create a task or tick a habit.');
  if(c.habitsToday > c.habitsDone) lines.push(isFa()?`بعد از آن ${dnum(c.habitsToday-c.habitsDone)} عادت باقی‌مانده را تیک بزن.`:`Then tick the ${dnum(c.habitsToday-c.habitsDone)} remaining habits.`);
  if(c.focusToday === 0) lines.push(isFa()?'یک بلوک تمرکز ۲۵ دقیقه‌ای هم بگذار؛ سریع‌ترین راه برای شروع.':'Add one 25-minute focus block — the fastest way to start.');
  if(c.overdue.length) lines.push(isFa()?`${dnum(c.overdue.length)} کار عقب‌افتاده داری؛ با هم به فردا منتقلشان کنیم؟`:`You have ${dnum(c.overdue.length)} overdue tasks — want to move them to tomorrow?`);
  return lines.join('\n');
}
function answerProgress(c){
  const out = [];
  out.push(isFa() ? `سطح ${dnum(c.lvl.level)} • ${dnum(c.lvl.total)} XP • ${dnum(c.lvl.need-c.lvl.into)} XP تا سطح بعد` :
                    `Level ${dnum(c.lvl.level)} • ${dnum(c.lvl.total)} XP • ${dnum(c.lvl.need-c.lvl.into)} XP to next`);
  out.push(isFa()?`امروز: ${dnum(c.todayTasks.filter(x=>x.done).length)} کار، ${dnum(c.habitsDone)} عادت، ${dnum(c.studyMinToday)} دقیقه مطالعه`:
                  `Today: ${dnum(c.todayTasks.filter(x=>x.done).length)} tasks, ${dnum(c.habitsDone)} habits, ${dnum(c.studyMinToday)} min studied`);
  out.push(isFa()?`هفت روز اخیر: ${dnum(c.studyMin7)} دقیقه مطالعه، ${dnum(c.taskRate7)}٪ تکمیل کارها`:

}
function answerHabits(c){
  if(!c.habits.length) return isFa()?'هنوز عادتی نساخته‌ای. پیشنهاد می‌کنم با یک عادت ۵ دقیقه‌ای شروع کنی — مثلاً «۱۰ دقیقه مطالعه».':'No habits yet. Start with a 5-minute one — e.g. "study 10 minutes".';

  out.push(isFa()?`${dnum(c.habits.length)} عادت فعالداری؛ امروز ${dnum(c.habitsDone)} انجام شد.`:`${dnum(c.habits.length)} active habits; ${dnum(c.habitsDone)} done today.`);
  c.habits.slice(0,5).forEach(h=>{
    const r = habitRate(h,14), s = habitStreak(h);
    out.push(`• ${h.title} — ${dnum(r)}٪ (۱۴ ${t('week')}) • ${t('streak')} ${dnum(s)}`);
  });

                                     `Weakest: ${c.weakestHabit.title}. Suggestion: halve its size to restart the chain.`);
  return out.join('\n');
}
function answerStudy(c){
  const out = [];
  const subj = c.d.sessions.length ? c.d.sessions.reduce((acc,s)=>{acc[s.subjectId]=(acc[s.subjectId]||0)+s.minutes;return acc;},{}) : {};
  const ranked = Object.entries(subj).sort((a,b)=>a[1]-b[1]);
  out.push(isFa()?'برنامهٔ پیشنهادی (بر پایهٔ داده‌های خودت):':'Suggested plan (from your own data):');
  if(c.nextExam){
    const left = Math.max(dayDiff(c.k,c.nextExam.date),1);
    out.push(isFa()?`«${c.nextExam.title}» ${dnum(left)} روز مانده → روزی ${dnum(Math.max(20,Math.round(120/left)))} دقیقه مرور.`:
                    `"${c.nextExam.title}" in ${dnum(left)} days → ${dnum(Math.max(20,Math.round(120/left)))} min review per day.`);
  }
  out.push(isFa()?'• ۲۵ دقیقه خواندن فعال + ۵ دقیقه یادآوری بدون نگاه کردن':'• 25 min active reading + 5 min recall without looking');
  out.push(isFa()?'• ۱۰ دقیقه بازگویی مطلب برای خودت (تکنیک فاینمن)':'• 10 min re-explaining it to yourself (Feynman technique)');
  if(ranked.length) {
    const weakest = c.d.subjects.find(s=>s.id===ranked[0][0]);
    if(weakest) out.push(isFa()?`• کم‌کارترین درس: ${weakest.title} — امشب ۲۰ دقیقه برایش بگذار`:`• Least studied: ${weakest.title} — give it 20 minutes tonight`);
  }
  if(c.overdue.length) out.push(isFa()?'• اول کارهای عقب‌افتاده را منتقل کن تا ذهنت شفاف شود':'• Reschedule overdue tasks first to clear your head');
  return out.join('\n');
}
function answerMissed(c){
  if(!c.overdue.length) return isFa()?'کار عقب‌افتاده‌ای نداری. عالیه.':'No overdue tasks. Nice.';
  const out = [isFa()?`${dnum(c.overdue.length)} کار عقب افتاده:`:`${dnum(c.overdue.length)} overdue:`,
    ...c.overdue.slice(0,5).map(x=>`• ${x.title} (${x.day})`)];
  out.push(isFa()?'پیشنهاد: همه را به «فردا» منتقل کنیم و امروز را با یک کار کوچک شروع کنی.':'Plan: move them all to tomorrow and start today with one small task.');
  out.push(isFa()?'بنویس «منتقل کن» تا انجامش بدهم.':'Type "move" and I will do it.');
  return out.join('\n');
}
function answerQuiz(c){
  const d = DB.data;
  const note = d.notes.find(n=>n.body && n.body.length > 80);
  const src = note ? stripHTML(note.body) : '';
  if(!src) return isFa()?'برای ساختن آزمونک، اول یک یادداشت با متن کافی بنویس (حداقل ۸۰ کاراکتر).':'To build a quiz, first write a note with some text (at least 80 characters).';
  const sents = src.split(/[.!?؟\n]+/).map(s=>s.trim()).filter(s=>s.length>35);
  if(!sents.length) return isFa()?'متن یادداشت کوتاه است؛ چند جملهٔ کامل اضافه کن.':'The note text is short — add a few full sentences.';
  const picks = sents.slice(0,4);
  return (isFa()?'آزمونک از یادداشت «'+note.title+'»:\n':'Quiz from note "'+note.title+'":\n') +
    picks.map((s,i)=>{
      const words = s.split(' ').filter(w=>w.length>5);
      const answer = words.length ? words[Math.floor(words.length/2)] : '—';
      const masked = s.replace(answer, '____');
      return (isFa()?`${dnum(i+1)}. جای خالی را پر کن:\n`:`${dnum(i+1)}. Fill the gap:\n`) + masked + (isFa()?'\n   (پاسخ: ':'\n   (answer: ') + answer + ')';
    }).join('\n');
}
function answerSummary(c){
  const n = DB.data.notes.slice().sort((a,b)=>b.updated-a.updated)[0];
  if(!n) return isFa()?'یادداشتی برای خلاصه کردن نیست.':'No note to summarise.';
  const txt = stripHTML(n.body || '');
  const sents = txt.split(/[.!?؟\n]+/).map(s=>s.trim()).filter(Boolean);
  const picks = [sents[0], sents[Math.floor(sents.length/2)], sents[sents.length-1]].filter(Boolean);
  return (isFa()?`خلاصهٔ «${n.title}» (${dnum(txt.split(/\s+/).length)} واژه):\n`:`Summary of "${n.title}" (${dnum(txt.split(/\s+/).length)} words):\n`)
    + picks.map(s=>'• '+s).join('\n')
    + (isFa()?'\n\n«این خلاصه با قاعده‌های محلی ساخته شده، نه مدل زبانی ابری.»':'\n\n"This summary is produced by local rules, not a cloud language model."');
}
function answerFeature(){

    : 'I can do this right here, offline:\n• "What should I do today?" → plan from your free time\n• "How am I doing?" → analysis of real records\n• "Analyse my habits"\n• "Give me a study plan"\n• "Build a quiz" from your notes\n• "Summarise"\nEverything is computed on this device.';
}
function answerMotivate(c){
  const base = companionLine('idle');
  const extra = isFa()?`\n\nتا اینجا ${dnum(c.lvl.total)} XP جمع کرده‌ای — یعنی ${dnum(c.lvl.total)} واحد کار واقعی. یک کار کوچک انتخاب کن و شروع کن.`
                      :`\n\nYou have collected ${dnum(c.lvl.total)} XP so far — that is ${dnum(c.lvl.total)} units of real work. Pick one small task and start.`;
  return base + extra;

function answerBreak(c){
  return isFa()
    ? `امروز ${dnum(c.studyMinToday)} دقیقه مطالعه و ${dnum(c.focusToday)} جلسهٔ تمرکز ثبت کرده‌ای.\nپیشنهاد: ۵ دقیقه بلند شو، آب بخور، به دور نگاه کن. بعد اگر انرژی داشتی یک بلوک ۲۵ دقیقه‌ای بزن — اگر نه، امروز را همین‌جا ببند.`
    : `Today you logged ${dnum(c.studyMinToday)} min of study and ${dnum(c.focusToday)} focus sessions.\nSuggestion: stand up for 5 minutes, drink water, look far away. Then one 25-min block if you have energy — otherwise close the day here.`;
}

function assistantReply(text){
  const c = buildContext();
  const intent = detectIntent(text);
  const q = text.toLowerCase();
  let body;
  switch(intent){
    case 'progress': body = answerProgress(c); break;
    case 'habits': body = answerHabits(c); break;
    case 'study': body = answerStudy(c); break;
    case 'missed': body = answerMissed(c); break;
    case 'quiz': body = answerQuiz(c); break;
    case 'summary': body = answerSummary(c); break;
    case 'feature': body = answerFeature(); break;
    case 'motivate': body = answerMotivate(c); break;
    case 'break': body = answerBreak(c); break;
    default: body = answerPlan(c);
  }
  /* actionable side-effects (local, reversible, never silent) */
  if((q.includes('منتقل') || q.includes('move')) && c.overdue.length){
    const t2 = todayKey(new Date(Date.now()+86400000));
    c.overdue.forEach(x=> x.day = t2);
    DB.save(); render();
    body += '\n\n' + (isFa()?'✔ انجام شد: کارهای عقب‌افتاده به فردا منتقل شدند.':'✔ Done: overdue tasks moved to tomorrow.');
  }
  return { body, intent, facts:true };
}
const stripHTML = h => String(h||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|li|h\d|blockquote)>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').trim();

/* task sorting shared by planner + assistant */
function sortTasks(list){
  const w = { high:0, normal:1, low:2 };
  return list.slice().sort((a,b)=>{
    if(!!a.done !== !!b.done) return a.done ? 1 : -1;
    const pa = w[a.priority] ?? 1, pb = w[b.priority] ?? 1;
    if(pa !== pb) return pa - pb;
    const da = a.day || '9999', db2 = b.day || '9999';
    return da.localeCompare(db2);
  });
}

/* ---------------- PLANNER ---------------- */
let plannerMode = 'day', plannerDate = todayKey();
function viewPlanner(){
  const d = DB.data, k = todayKey();
  let list;
  if(plannerMode === 'day') list = d.tasks.filter(x=> x.day === plannerDate || (!x.day && plannerDate===k));
  else if(plannerMode === 'week'){
    list = d.tasks.filter(x=>{
      if(!x.day) return false;
      const diff = dayDiff(plannerDate, x.day);
      return diff >= -6 && diff <= 0;
    });
  } else list = d.tasks.filter(x=> x.day && x.day.slice(0,7) === plannerDate.slice(0,7));
  list = sortTasks(list);
  const open = list.filter(x=>!x.done).length;

  const dateLabel = plannerMode==='month'
    ? new Intl.DateTimeFormat(isFa()?'fa-IR':'en-GB',{month:'long',year:'numeric'}).format(new Date(plannerDate+'T00:00'))
    : plannerMode==='week'
      ? (isFa()?'۷ روز منتهی به ':'7 days to ') + fmtShort(new Date(plannerDate+'T00:00'))
      : fmtDate(new Date(plannerDate+'T00:00'), {year:true});

  return `
  <div class="scroll-x">
    ${['day','week','month'].map(m=>`<button class="chip ${plannerMode===m?'on':''}" data-act="plannerMode" data-mode="${m}">${t(m)}</button>`).join('')}
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <button class="icon-btn" data-act="shiftDate" data-dir="-1">${icon('chevron')}</button>

      <button class="icon-btn" data-act="shiftDate" data-dir="1" style="transform:rotate(180deg)">${icon('chevron')}</button>
    </div>
    ${plannerMode==='month' ? monthGrid() : plannerMode==='week' ? weekStrip() : ''}
    <div class="row" style="margin-top:10px;font-size:11.5px;color:var(--muted)">
      <span>${dnum(list.length)} ${t('tasks')}</span><span class="spacer"></span><span>${dnum(open)} ${isFa()?'باز':'open'}</span>
    </div>
    <div class="sep" style="margin:10px 0"></div>
    ${list.length ? list.map(taskRow).join('') : `<div class="empty"><div class="big">✦</div>${t('emptyTasks')}</div>`}
  </div>
  <button class="btn block" data-act="newTask">${icon('plus')} ${t('addTask')}</button>
  ${d.tasks.filter(x=>!x.done && x.day && dayDiff(x.day, k)>0).length ? `<button class="btn ghost block" data-act="rescheduleOverdue">${icon('refresh')} ${t('missedTasks')} (${dnum(d.tasks.filter(x=>!x.done&&x.day&&dayDiff(x.day,k)>0).length)})</button>`:''}

    <div class="card-head"><h3>${t('quickAdd')}</h3></div>
    <div class="row"><input id="quickAddInput" placeholder="${isFa()?'مثلاً: مرور فصل ۳': 'e.g. Review chapter 3'}" />
      <button class="btn" data-act="quickAdd">${t('addQuick')}</button></div>
    <div class="tiny muted" style="margin-top:8px">${isFa()?'Enter برای افزودن سریع':'Press Enter to add fast'}</div>
  </div>`;
}
function monthGrid(){
  const d = new Date(plannerDate+'T00:00');
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const startDow = (first.getDay()+6)%7;
  const days = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  const cells = [];
  const dowNames = isFa()?['ش','ی','د','س','چ','پ','ج']:['M','T','W','T','F','S','S'];
  dowNames.forEach(x=> cells.push(`<div class="dow">${x}</div>`));
  for(let i=0;i<startDow;i++) cells.push('<div class="day out"></div>');
  for(let i=1;i<=days;i++){
    const key = new Date(d.getFullYear(), d.getMonth(), i);
    const kk = todayKey(key);
    const count = DB.data.tasks.filter(x=>x.day===kk).length;
    cells.push(`<div class="day ${kk===todayKey()?'today':''} ${kk===plannerDate?'sel':''}" data-act="pickDay" data-day="${kk}">
      ${dnum(i)}${count?`<span class="dot"></span>`:''}</div>`);
  }
  return `<div class="cal">${cells.join('')}</div>`;
}
function weekStrip(){
  const out = [];
  for(let i=6;i>=0;i--){
    const dt = new Date(plannerDate+'T00:00'); dt.setDate(dt.getDate()-i);
    const kk = todayKey(dt);
    const count = DB.data.tasks.filter(x=>x.day===kk && !x.done).length;
    out.push(`<div class="day ${kk===todayKey()?'today':''}" data-act="pickDay" data-day="${kk}" style="aspect-ratio:auto;padding:8px 4px">
      <div style="font-size:9.5px;color:var(--muted)">${(new Intl.DateTimeFormat(isFa()?'fa-IR':'en-GB',{weekday:'short'}).format(dt))}</div>
      <div style="font-weight:900">${dnum(dt.getDate())}</div>
      <div style="font-size:9px;color:var(--accent)">${count?dnum(count):''}</div></div>`);
  }
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${out.join('')}</div>`;
}

function focusStart(){
  if(focusState.running) return;
  focusState.running = true; focusState.at = Date.now();
  focusTick = setInterval(()=>{
    if(focusState.mode==='stopwatch'){ focusState.elapsed = Math.floor((Date.now()-focusState.at)/1000) + (focusState.elapsed||0); }
    else {
      focusState.sec -= 1;
      if(focusState.sec <= 0){ focusComplete(); return; }
    }
    const el = document.querySelector('.timer-dial .t');
    if(el) el.textContent = focusState.mode==='stopwatch'?fmtClock(focusState.elapsed):fmtClock(focusState.sec);
    const dial = document.querySelector('.timer-dial');
    if(dial && focusState.total) dial.style.setProperty('--p', Math.round((focusState.total-focusState.sec)/focusState.total*100));
  }, 1000);
  render();
}
function focusPause(){
  focusState.running = false;
  clearInterval(focusTick); focusTick = null;
  if(focusState.mode==='stopwatch'){ focusState.elapsedStored = focusState.elapsed; focusState.elapsed = 0; }
  render();
}
function focusStopReset(){
  focusState.running = false; clearInterval(focusTick); focusTick = null;
  focusState.sec = focusState.total; focusState.elapsed = 0;
  render();
}
function focusComplete(){
  clearInterval(focusTick); focusTick = null; focusState.running = false;
  const minutes = Math.round(focusState.total/60);
  DB.data.focus.push({ id:uid('fo'), kind:focusState.mode, at:Date.now(), seconds:focusState.total, done:true });
  DB.save();
  XP.grant(XP_RATES.session, `focus:${Date.now()}`, isFa()?'جلسهٔ تمرکز':'Focus session');
  if(focusState.mode==='pomodoro'){
    // also log a study session if a subject exists
    const s = DB.data.subjects[0];
    if(s){
      DB.data.sessions.push({ id:uid('se'), subjectId:s.id, day:todayKey(), minutes, note:isFa()?'از پومودورو':'from pomodoro', at:Date.now() });
      DB.save();
    }
  }
  focusState.sec = focusState.total; focusState.elapsed = 0;
  toast(t('focusDone')); spark('⏱'); chime();
  companionSay(companionLine(focusState.mode==='break'?'break':'focus'));
  checkAchievements();
  render();
}

async function openPdfFile(file){
  pdfState.error=''; pdfState.name = file.name; pdfState.page = 1;
  const existing = DB.data.pdfs.find(p=>p.name===file.name);
  try{
    const buf = await file.arrayBuffer();
    const lib = await loadPdfLib();
    pdfState.doc = await lib.getDocument({data:new Uint8Array(buf)}).promise;
    pdfState.pages = pdfState.doc.numPages;
    pdfState.page = existing ? clamp(existing.page||1,1,pdfState.pages) : 1;
    const rec = DB.data.pdfs.find(p=>p.name===file.name);
    if(rec){ rec.pages = pdfState.pages; rec.at = Date.now(); }
    else DB.data.pdfs.push({ id:uid('pdf'), name:file.name, pages:pdfState.pages, page:pdfState.page, at:Date.now() });
    DB.save(); render();
    await renderPdfPage();
  }catch(err){
    // graceful offline fallback: metadata-only mode
    pdfState.pages = existing ? existing.pages : 0;
    pdfState.error = isFa()
      ? 'موتور نمایش PDF در این محیط در دسترس نیست (نیاز به شبکه/اپ کامل). حالت «سند دستی» را ببین: بوکمارک‌ها و یادداشت‌ها همچنان ذخیره می‌شوند.'
      : 'The PDF engine is unavailable here (needs network / full app). Use “Add document manually” — bookmarks and page notes still persist.';
    if(!DB.data.pdfs.some(p=>p.name===file.name))
      DB.data.pdfs.push({ id:uid('pdf'), name:file.name, pages:0, page:1, at:Date.now() });
    DB.save(); render();
  }
}
async function renderPdfPage(){
  if(!pdfState.doc) return;
  const stage = document.getElementById('pdfStage');
  if(!stage) return;
  stage.innerHTML = '<div class="empty" style="color:#cfd6d0">…</div>';
  const page = await pdfState.doc.getPage(pdfState.page);
  const vp = page.getViewport({ scale: pdfState.scale * 1.35 });
  const canvas = document.createElement('canvas');
  canvas.width = vp.width; canvas.height = vp.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext:ctx, viewport:vp }).promise;
  stage.innerHTML = ''; stage.appendChild(canvas);
  const rec = DB.data.pdfs.find(p=>p.name===pdfState.name);
  if(rec){ rec.page = pdfState.page; rec.at = Date.now(); DB.save(); }
}

/* ---------------- SUDOKU ---------------- */
const sudokuState = { grid:[], given:[], notes:[], sel:null, diff:'easy', mistakes:0, hints:3, t0:0, timer:null, done:false };
const DIFF_REMOVE = { easy:38, medium:46, hard:52, expert:56 };

function sdkBlank(){ return Array.from({length:81},()=>0); }
function sdkValid(g,i,v){
  const r = Math.floor(i/9), c = i%9;
  for(let k=0;k<9;k++){
    if(g[r*9+k]===v && r*9+k!==i) return false;
    if(g[k*9+c]===v && k*9+c!==i) return false;
  }
  const br = Math.floor(r/3)*3, bc = Math.floor(c/3)*3;
  for(let dr=0;dr<3;dr++) for(let dc=0;dc<3;dc++){
    const idx = (br+dr)*9 + bc+dc;
    if(g[idx]===v && idx!==i) return false;
  }
  return true;
}
function sdkSolve(g){
  const i = g.indexOf(0);
  if(i < 0) return true;
  const nums = [1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-0.5);
  for(const v of nums){
    if(sdkValid(g,i,v)){ g[i]=v; if(sdkSolve(g)) return true; g[i]=0; }
  }
  return false;
}
function sdkCount(g, limit=2){
  const i = g.indexOf(0);
  if(i < 0) return 1;
  let n = 0;
  for(let v=1;v<=9;v++){
    if(sdkValid(g,i,v)){
      g[i]=v; n += sdkCount(g, limit-n); g[i]=0;
      if(n >= limit) return n;
    }
  }
  return n;
}
function newSudoku(diff='easy'){
  const full = sdkBlank(); sdkSolve(full);
  const puzzle = full.slice();
  const cells = [...Array(81).keys()].sort(()=>Math.random()-0.5);
  let removed = 0; const target = DIFF_REMOVE[diff] || 40;
  for(const i of cells){
    if(removed >= target) break;
    const backup = puzzle[i];
    puzzle[i] = 0;
    const copy = puzzle.slice();
    if(sdkCount(copy, 2) !== 1){ puzzle[i] = backup; }
    else removed++;
  }
  sudokuState.grid = puzzle.slice();
  sudokuState.given = puzzle.map(v=>v!==0);
  sudokuState.notes = Array.from({length:81},()=>new Set());
  sudokuState.sel = null; sudokuState.diff = diff; sudokuState.mistakes = 0;
  sudokuState.hints = 3; sudokuState.done = false;
  sudokuState.t0 = Date.now();
  clearInterval(sudokuState.timer);
  sudokuState.timer = setInterval(()=>{
    const el = document.getElementById('sdkTime');
    if(el && !sudokuState.done) el.textContent = fmtClock(Math.floor((Date.now()-sudokuState.t0)/1000));
  }, 1000);
  if(view === 'sudoku') render();
}
let sdkNotesMode = false;

function viewSudoku(){
  if(!sudokuState.grid.length) newSudoku('easy');
  const g = sudokuState.grid;
  const sel = sudokuState.sel;
  const selVal = sel!=null ? g[sel] : 0;
  const cells = g.map((v,i)=>{
    const r = Math.floor(i/9), c = i%9;
    let cls = 'c';
    if(sudokuState.given[i]) cls += ' given';
    if(sel === i) cls += ' sel';
    else if(sel != null && (Math.floor(sel/9)===r || sel%9===c ||
      (Math.floor(Math.floor(sel/9)/3)===Math.floor(r/3) && Math.floor((sel%9)/3)===Math.floor(c/3)))) cls += ' peer';
    if(v && selVal && v===selVal && sel!==i) cls += ' sel';
    const wrong = v && !sudokuState.given[i] && !sdkValid(g,i,v);
    if(wrong) cls += ' err';
    const noteHTML = (!v && sudokuState.notes[i].size)
      ? `<small>${[...Array(9).keys()].map(n=> sudokuState.notes[i].has(n+1)? (n+1) : '').join('')}</small>` : '';
    return `<div class="${cls}" data-act="sdkCell" data-i="${i}">${v||''}${noteHTML}</div>`;
  }).join('');
  const best = DB.data.sudoku.filter(s=>s.solved && s.diff===sudokuState.diff).sort((a,b)=>a.seconds-b.seconds)[0];
  return `
  <div class="scroll-x">${['easy','medium','hard','expert'].map(x=>`<button class="chip ${sudokuState.diff===x?'on':''}" data-act="sdkNew" data-diff="${x}">${t(x)}</button>`).join('')}</div>
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <span class="pill">${t('time')}: <b id="sdkTime">${fmtClock(Math.floor((Date.now()-sudokuState.t0)/1000))}</b></span>
      <span class="pill ${sudokuState.mistakes?'warn':''}">${t('mistakes')}: ${dnum(sudokuState.mistakes)}</span>
      <span class="spacer"></span>
      <span class="pill pri">${isFa()?'رکورد':'best'}: ${best?fmtClock(best.seconds):'—'}</span>
    </div>
    <div class="sgrid">${cells}</div>
    <div class="row" style="margin-top:12px">
      <button class="btn sm ${sdkNotesMode?'':'ghost'}" data-act="sdkNotes">${t('notesMode')}</button>
      <button class="btn sm ghost" data-act="sdkHint">${isFa()?'راهنما':'Hint'} (${dnum(sudokuState.hints)})</button>
      <button class="btn sm ghost" data-act="sdkErase">⌫</button>
      <span class="spacer"></span>
      <button class="btn sm ghost" data-act="sdkNew" data-diff="${sudokuState.diff}">${t('newGame')}</button>
    </div>
    <div class="skeys" style="margin-top:10px">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="sdkNum" data-n="${n}">${isFa()?dnum(n):n}</button>`).join('')}
    </div>
    ${sudokuState.done?`<div class="empty" style="color:var(--ok)"><div class="big" style="color:var(--ok)">★</div>${t('solved')}</div>`:''}
  </div>
  <div class="card flat">
    <div class="card-head"><h3>${isFa()?'رکوردها':'Records'}</h3></div>
    ${DB.data.sudoku.length ? DB.data.sudoku.slice().reverse().slice(0,6).map(s=>`<div class="item">
      <div class="txt"><div class="t1">${t(s.diff)}</div><div class="t2"><span>${fmtShort(new Date(s.at))}</span></div></div>
      <span class="pill ${s.solved?'ok':''}">${s.solved?fmtClock(s.seconds):(isFa()?'ناتمام':'unfinished')}</span></div>`).join('')
      : `<div class="empty">${isFa()?'اولین بازی را شروع کن':'Play your first game'}</div>`}
  </div>`;
}
function sdkPlace(n){
  const i = sudokuState.sel;
  if(i==null || sudokuState.given[i] || sudokuState.done) return;
  if(sdkNotesMode){
    if(sudokuState.grid[i]) return;
    sudokuState.notes[i].has(n) ? sudokuState.notes[i].delete(n) : sudokuState.notes[i].add(n);
    render(); return;
  }
  sudokuState.grid[i] = n;
  sudokuState.notes[i].clear();
  if(!sdkValid(sudokuState.grid, i, n)){ sudokuState.mistakes++; toast(isFa()?'این عدد با قوانین نمی‌خواند':'That number breaks the rules'); }
  checkSudokuDone();
  render();
}
function checkSudokuDone(){
  const g = sudokuState.grid;
  if(g.some(v=>!v)) return;
  if(g.some((v,i)=>!sdkValid(g,i,v))) return;
  sudokuState.done = true;
  clearInterval(sudokuState.timer);
  const seconds = Math.floor((Date.now()-sudokuState.t0)/1000);
  DB.data.sudoku.push({ id:uid('sk'), diff:sudokuState.diff, solved:true, seconds, at:Date.now() });
  DB.save();
  XP.grant(XP_RATES.sudoku, `sudoku:${Date.now()}`, 'Sudoku');
  toast(t('solved'),'gold'); spark('▦'); chime(); checkAchievements();
}

  DB.data.chats.push({ id:uid('ch'), role:'me', text:q, at:Date.now() });
  const r = assistantReply(q);
  DB.data.chats.push({ id:uid('ch'), role:'ai', text:r.body, at:Date.now(), intent:r.intent });
  DB.save(); render();
  setTimeout(()=>{
    const box = document.getElementById('chatBox');
    if(box) box.lastElementChild?.scrollIntoView({behavior:'smooth', block:'end'});
  }, 40);
}

const ASSESS = [
  { type:'logic', q:{fa:'۲، ۴، ۸، ۱۶، ؟', en:'2, 4, 8, 16, ?'}, opts:['24','32','30','20'], a:'32',
    cat:{fa:'استدلال منطقی', en:'Logical reasoning'} },
  { type:'logic', q:{fa:'اگر همهٔ Aها B باشند و همهٔ Bها C، آنگاه:', en:'If all A are B and all B are C, then:'},
    opts:[ 'همهٔ Aها C هستند','هیچ Aای C نیست','برخی Cها A نیستند','نمی‌شود گفت' ],
    a:'همهٔ Aها C هستند', cat:{fa:'استدلال منطقی', en:'Logical reasoning'} },
  { type:'pattern', q:{fa:'کدام الگو ادامه دارد؟ ▲ ● ▲● ▲●● ؟', en:'Which continues? ▲ ● ▲● ▲●● ?'},
    opts:['▲●●●','●▲●','▲▲','●'], a:'▲●●●', cat:{fa:'شناخت الگو', en:'Pattern recognition'} },
  { type:'memory', q:{fa:'کدام گزینه دقیقاً همان ترتیب «۷ ۳ ۹ ۱» است؟', en:'Which matches the order "7 3 9 1"?'},
    opts:['۷ ۳ ۹ ۱','۷ ۹ ۳ ۱','۳ ۷ ۹ ۱','۱ ۳ ۹ ۷'], a:'۷ ۳ ۹ ۱', cat:{fa:'حافظه', en:'Memory'} },
  { type:'speed', q:{fa:'۱۵ + ۲۷ = ؟', en:'15 + 27 = ?'}, opts:['32','42','41','52'], a:'42', cat:{fa:'سرعت پردازش', en:'Processing speed'} },
  { type:'logic', q:{fa:'۹، ۷، ۵، ۳، ؟', en:'9, 7, 5, 3, ?'}, opts:['۲','۱','۰','۴'], a:'1', cat:{fa:'استدلال منطقی', en:'Logical reasoning'} }
];
let assessState = { i:0, answers:[], t0:0 };
function viewAssessment(){
  const q = ASSESS[assessState.i];
  const pct = Math.round(assessState.i/ASSESS.length*100);
  return `<div class="onb">
    <div class="steps"><i class="on" style="flex:${pct||1}"></i><i style="flex:${100-(pct||1)}"></i></div>
    <div class="row"><span class="pill">${dnum(assessState.i+1)} / ${dnum(ASSESS.length)}</span><span class="spacer"></span>
      <span class="pill pri">${esc(L(q.cat))}</span></div>
    <h1 style="font-size:22px;line-height:1.6">${esc(L(q.q))}</h1>
    <div style="display:grid;gap:10px;margin-top:6px">
      ${q.opts.map((o,i)=>`<div class="opt" data-act="assessAnswer" data-v="${esc(o)}" data-i="${i}">${esc(o)}</div>`).join('')}
    </div>
    <div class="spacer"></div>
    <p class="tiny muted center">${isFa()?'این آزمون سرگرمی است و نمرهٔ هوش بالینی تولید نمی‌کند.':'This is an entertainment self-check and does not produce a clinical IQ score.'}</p>
    <button class="btn ghost block" data-act="assessSkip">${t('skip')}</button>
  </div>`;
}
function assessResult(){
  const cats = {};
  ASSESS.forEach((q,i)=>{
    const ok = assessState.answers[i] === q.a;
    const k = q.cat.en;
    cats[k] = cats[k] || { c:0, t:0 };
    cats[k].t++; if(ok) cats[k].c++;
  });
  const profile = {};
  Object.entries(cats).forEach(([k,v])=>{ profile[k] = Math.round(v.c/v.t*100); });
  return { at:Date.now(), answers:assessState.answers, profile,
    note:'Entertainment self-assessment. Not a clinical IQ measurement.' };
}

/* ---------- theme ---------- */
function applyTheme(){
  const p = DB.data.profile;
  const themeId = p.onboarded ? p.theme : (typeof onb !== 'undefined' ? onb.theme : p.theme);
  const th = THEMES[themeId] || THEMES.overgrown;
  const root = document.documentElement;
  Object.entries(th.vars).forEach(([k,v])=> root.style.setProperty(k,v));
  if(p.mode === 'light'){
    Object.entries(LIGHT_VARS).forEach(([k,v])=> root.style.setProperty(k,v));
    if(!document.body.dataset.lightPatched){
      root.style.setProperty('--pattern', th.vars['--pattern']);
      document.body.dataset.lightPatched = '1';
    }
  }
  document.documentElement.lang = isFa() ? 'fa' : 'en';
  document.documentElement.dir = isFa() ? 'rtl' : 'ltr';
  document.body.style.setProperty('--nav-h', '74px');
  if(p.settings.reduceMotion) document.documentElement.style.setProperty('scroll-behavior','auto');
  document.title = t('appName') + ' — ' + (VIEWS[view]?.title || '');
}

/* ---------- router ---------- */
function go(v){
  if(!VIEWS[v]) v = 'home';
  if(view !== v) navStack.push(v);
  view = v;
  render();
  window.scrollTo({top:0, behavior:'auto'});
}

  applyTheme();
